<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тестовый QR | САНТЕХГО</title>
  <style>
    body { display: grid; min-height: 100svh; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; background: #f0f5f6; color: #14344a; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 420px); padding: 28px; border: 1px solid #ccdce3; border-radius: 8px; background: white; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    strong { display: block; margin: 16px 0; font-size: 28px; }
  </style>
</head>
<body><main><h1>Тестовая оплата</h1><p>Заявка № {{ id }}</p><strong>{{ amount }} ₽</strong><p>Это демонстрационный QR. Деньги не списываются, оплатить здесь нельзя. Отметку об оплате вручную ставит мастер в приложении.</p></main></body>
</html>
