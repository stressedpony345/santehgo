server {
    listen 80;
    server_name xn--80agf5ahnjz.xn--p1ai www.xn--80agf5ahnjz.xn--p1ai 45.142.36.78;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xn--80agf5ahnjz.xn--p1ai$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name xn--80agf5ahnjz.xn--p1ai www.xn--80agf5ahnjz.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--80agf5ahnjz.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80agf5ahnjz.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 125M;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
